<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <title>Player Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body th:class="${currentTheme == 'light'} ? 'light' : ''">
<div class="profile-container">
    <div class="profile-header">
        <h1 th:text="${@userController.logged} ? ${@userController.loggedUser.login} + '\'s profile'"></h1>
        <div class="profile-links">
            <a href="/logout">Logout</a>
            <div class="theme-toggle">
                <label class="switch">
                    <input type="checkbox" th:checked="${currentTheme == 'light'}"
                           hx-post="/toggle-theme"
                           hx-swap="none"
                           hx-target="body"
                           hx-on::after-request="if (event.detail.xhr.responseText === 'light') {
                               document.body.classList.add('light');
                           } else {
                               document.body.classList.remove('light');
                           }">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <h3 style="text-align: center;">Your Rating for BlockGame</h3>
    <table>
        <thead>
        <tr>
            <th>Your Rating</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${userRating != 0}">
            <td th:text="${userRating}"></td>
        </tr>
        <tr th:if="${userRating == 0}">
            <td colspan="2">You haven't rated BlockGame yet.</td>
        </tr>
        </tbody>
    </table>
    <h3 style="text-align: center;">Your Latest Score for BlockGame</h3>
    <table>
        <thead>
        <tr>
            <th>Score and date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${latestScore != null}">
            <td th:text="${latestScore.points}"></td>
            <td th:text="${#dates.format(latestScore.playedOn, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${latestScore == null}">
            <td colspan="2">You don't have a score yet.</td>
        </tr>
        </tbody>
    </table>

    <h3 style="text-align: center;">Your Latest Comment for BlockGame</h3>
    <table>
        <thead>
        <tr>
            <th>Comment and date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${latestComment != null}">
            <td th:text="${latestComment.comment}"></td>
            <td th:text="${#dates.format(latestComment.commentedOn, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${latestComment == null}">
            <td colspan="2">You haven't commented on BlockGame yet.</td>
        </tr>
        </tbody>
    </table>


    <div style="text-align: center; margin-top: 30px;">
        <a href="/blockgame" class="btn btn-primary">Back to Game</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.querySelector('.switch input');
        toggle.checked = document.body.classList.contains('light');
    });
</script>
</body>
</html>
