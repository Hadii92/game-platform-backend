<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <title>Hall of Fame - Block Game</title>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link th:href="@{/css/halloffame.css}" rel="stylesheet">
</head>
<body th:class="${currentTheme == 'light'} ? 'light' : ''">
<div class="game-container">
    <header>
        <div class="header-content">
            <div class="header-left">
                <div style="display: flex; align-items: center;">
                    <div class="logo-board">
                        <div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div>
                        <div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div>
                        <div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell"></div>
                        <div class="logo-cell static-block"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div>
                        <div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell"></div><div class="logo-cell"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div>
                        <div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div><div class="logo-cell static-block"></div>
                        <div class="piece">
                            <div class="block"></div><div class="block"></div><div class="empty"></div>
                            <div class="empty"></div><div class="block"></div><div class="block"></div>
                        </div>
                    </div>
                    <h1>Hall of Fame</h1>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary header-btn" hx-get="/blockgame" hx-target="body">Back to Game</button>
                <button class="btn btn-primary header-btn" hx-get="/comments" hx-target="body">Comments</button>
                <button class="btn btn-primary header-btn" hx-get="/modal" hx-target="#modals-here .modal-content" data-bs-toggle="modal" data-bs-target="#modals-here">Rules</button>
                <div class="profile-links">
                    <span>Logged as: </span>
                    <span th:text="${@userController.logged} ? ${@userController.loggedUser.login} : 'Guest'"></span>
                    <a href="/profile">Profile</a>
                    <a href="/logout">Logout</a>
                </div>
                <div class="theme-toggle">
                    <label class="switch">
                        <input type="checkbox" th:checked="${currentTheme == 'light'}"
                               hx-post="/toggle-theme"
                               hx-swap="none"
                               hx-target="body"
                               hx-on::after-request="if (event.detail.xhr.responseText === 'light') {
                                       document.body.classList.add('light');
                                   } else {
                                       document.body.classList.remove('light');
                                   }">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <div id="modals-here" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"></div>
        </div>
    </div>

    <h2>Top Scores</h2>
    <table id="serverSideScoreTable">
        <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Points</th>
            <th>Played at</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="score, iterStat: ${scores}">
            <td class="rank-cell">
                <span th:if="${iterStat.count == 1}">🥇</span>
                <span th:if="${iterStat.count == 2}">🥈</span>
                <span th:if="${iterStat.count == 3}">🥉</span>
                <span th:if="${iterStat.count > 3}" th:text="${iterStat.count}"></span>
            </td>
            <td th:text="${score.player}"></td>
            <td th:text="${score.points}"></td>
            <td th:text="${#dates.format(score.playedOn, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.querySelector('.switch input');
        toggle.checked = document.body.classList.contains('light');
    });
</script>
</body>
</html>
